<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- ======================================================== -->
  <!-- 1. ANTI-CACHE HEADERS PER BROWSER MOBILE                 -->
  <!-- ======================================================== -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- ======================================================== -->
  <!-- 2. SMART CACHE-BUSTER JAVASCRIPT                         -->
  <!-- Ricarica con timestamp fresco solo se la pagina è aperta -->
  <!-- da più di 45 secondi o non ha ancora il parametro 't'   -->
  <!-- evitando loop infiniti.                                  -->
  <!-- ======================================================== -->
  <script>
    (function () {
      try {
        const url = new URL(window.location.href);
        const lastTimestamp = parseInt(url.searchParams.get('_t') || '0', 10);
        const now = Date.now();
        // Se manca il parametro o la pagina è stata aperta da un link vecchio di oltre 45s:
        if (!lastTimestamp || (now - lastTimestamp > 45000)) {
          url.searchParams.set('_t', now);
          window.location.replace(url.toString());
        }
      } catch (err) {
        console.warn("Cache buster non applicabile:", err);
      }
    })();
  </script>

  <title>Menù Frigo • Piano Alimentare Settimanale</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    };
  </script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      font-family: 'Inter', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .card-fade {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col antialiased selection:bg-emerald-500 selection:text-white transition-colors duration-200">

  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-xs">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between gap-3">
      
      <!-- Logo and Today Date -->
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xl shadow-xs">
          <i class="ph-fill ph-fork-knife"></i>
        </div>
        <div>
          <h1 class="text-sm font-extrabold tracking-tight flex items-center gap-1.5 leading-tight text-slate-900 dark:text-white">
            Menù Frigo
            <span class="text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">Live</span>
          </h1>
          <p id="today-sub-caption" class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Caricamento data...</p>
        </div>
      </div>

      <!-- Quick Action Buttons: Force Refresh & Dark Mode -->
      <div class="flex items-center gap-1">
        <button id="force-reload-btn" title="Ricarica forzata menù" class="p-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition">
          <i class="ph-bold ph-arrows-clockwise text-base"></i>
        </button>
        <button id="theme-btn" title="Cambia tema chiaro/scuro" class="p-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition">
          <i class="ph-bold ph-sun text-base dark:hidden"></i>
          <i class="ph-bold ph-moon text-base hidden dark:block"></i>
        </button>
      </div>

    </div>

    <!-- Dual Profile Switcher Pill -->
    <div class="max-w-md mx-auto px-4 pb-3">
      <div class="bg-slate-200/80 dark:bg-slate-800/80 p-1 rounded-2xl flex items-center select-none shadow-inner">
        <button id="tab-lui" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-xs bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>Lui</span>
        </button>
        <button id="tab-lei" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
          <span class="w-2 h-2 rounded-full bg-transparent"></span>
          <span>Lei</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="sticky top-[108px] z-20 bg-white/95 dark:bg-slate-900/95 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 py-2">
    <div class="max-w-md mx-auto px-3">
      <div id="days-nav-container" class="flex items-center justify-between gap-1 overflow-x-auto no-scrollbar py-0.5">
        <!-- Rendered dynamically by script -->
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-3.5 pb-16">
    
    <!-- Title and 'Torna ad oggi' helper -->
    <div class="flex items-center justify-between px-1">
      <div class="flex items-center gap-2">
        <h2 id="viewing-day-label" class="text-base font-bold text-slate-900 dark:text-slate-50 tracking-tight">Oggi</h2>
        <span id="badge-today-active" class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300">OGGI</span>
      </div>
      <button id="jump-to-today-btn" class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 hover:underline flex items-center gap-1">
        <i class="ph-bold ph-arrow-u-up-left"></i>
        Torna ad oggi
      </button>
    </div>

    <!-- Meal Cards Target Container -->
    <div id="meals-list" class="space-y-3">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Footer reminder info -->
    <div class="mt-6 pt-4 text-center">
      <p class="text-[11px] text-slate-400 dark:text-slate-500 flex items-center justify-center gap-1.5 font-medium">
        <i class="ph-bold ph-drop text-blue-500"></i> Ricordati di bere almeno 2 litri d'acqua al giorno
      </p>
    </div>

  </main>

  <script>
    // =========================================================================
    // MODIFICA QUI I TUOI PASTI DIRETTAMENTE SU GITHUB
    // 1 = Lunedì, 2 = Martedì, 3 = Mercoledì, 4 = Giovedì, 5 = Venerdì, 6 = Sabato, 7 = Domenica
    // =========================================================================
    const PIANO_ALIMENTARE = {
      lui: {
        1: {
          colazione: "Porridge d'avena (60g) con latte scremato, 1 mela a pezzetti e caffè amaro",
          pranzo: "Pasta integrale (90g) con tonno al naturale (110g), pomodorini e rucola",
          spuntino: "1 banana + 20g mandorle tostate",
          cena: "Petto di pollo alla piastra (200g) con zucchine trifolate e 50g pane di segale"
        },
        2: {
          colazione: "Pancake di avena e albumi con un filo di miele o mirtilli freschi",
          pranzo: "Riso basmati (90g) con bocconcini di tacchino al curry e fagiolini al vapore",
          spuntino: "Yogurt greco 0% (150g) con noci",
          cena: "Trancio di salmone al forno (200g) con spinaci saltati e patate dolci (150g)"
        },
        3: {
          colazione: "Toast integrale con 1 uovo sodo, affettato di tacchino e spremuta d'arancia",
          pranzo: "Farro perlato (90g) con ceci, pomodorini secchi, olive nere e basilico",
          spuntino: "1 mela + 15g anacardi al naturale",
          cena: "Tagliata di manzo magro (180g) con rucola, scaglie di grana e contorno di bietole"
        },
        4: {
          colazione: "Porridge d'avena al cacao amaro con banana a rondelle",
          pranzo: "Gnocchi di patate (160g) con sugo di pomodoro fresco e ricotta magra (60g)",
          spuntino: "2 gallette di riso con burro d'arachidi 100%",
          cena: "Filetti di merluzzo al pomodoro, capperi e origano + cavolfiore al vapore"
        },
        5: {
          colazione: "3 fette biscottate integrali con marmellata senza zuccheri aggiunti + kefir",
          pranzo: "Couscous integrale con verdure croccanti saltate e straccetti di pollo (150g)",
          spuntino: "Frutta fresca di stagione + quadratino di cioccolato 85%",
          cena: "Omelette di 3 uova con asparagi + insalata mista e panino integrale (50g)"
        },
        6: {
          colazione: "Smoothie bowl con frutti di bosco, fiocchi d'avena e semi di lino",
          pranzo: "Risotto allo zafferano e funghi con parmigiano reggiano",
          spuntino: "Una manciata di mandorle (20g)",
          cena: "Pizza margherita artigianale (serata libera controllata) + insalata"
        },
        7: {
          colazione: "Waffle o french toast fit con albumi, cannella e frutti di bosco",
          pranzo: "Pranzo domenicale: Pollo arrosto senza pelle con patate al forno e verdure",
          spuntino: "Tè verde con 2 biscotti d'avena",
          cena: "Vellutata di zucca e carote con crostini integrali e fiocchi di latte"
        }
      },

      lei: {
        1: {
          colazione: "Yogurt greco 0% (150g) con frutti rossi freschi, 30g muesli e tè verde",
          pranzo: "Quinoa con gamberetti (130g), zucchine a rondelle e carotine a julienne",
          spuntino: "1 mela Fuji a fettine con cannella",
          cena: "Orata al cartoccio con finocchi al vapore e insalata mista condita con olio EVO"
        },
        2: {
          colazione: "2 fette di pane integrale tostato con ricotta fresca e cannella",
          pranzo: "Pasta di legumi (70g) con crema di broccoli e spolverata di grana (10g)",
          spuntino: "1 pera o frutto di stagione",
          cena: "Petto di pollo alle erbe aromatiche (140g) con purè di zucca fatto in casa"
        },
        3: {
          colazione: "Pancake d'avena leggeri (solo albumi) con marmellata d'arance amara",
          pranzo: "Insalata di riso venere (65g) con dadini di salmone affumicato e avocado",
          spuntino: "10 mandorle pelate",
          cena: "Tortino di uova e verdure (ricotta e spinaci) con carote al forno"
        },
        4: {
          colazione: "Chia pudding preparato la sera prima con latte di mandorla e fragole",
          pranzo: "Vellutata di piselli con crostini integrali (40g) e formaggio fresco light",
          spuntino: "1 spremuta fresca d'arancia",
          cena: "Burger vegetale di lenticchie fatto in casa con fagiolini e pomodorini"
        },
        5: {
          colazione: "2 fette wasa con avocado schiacciato, gocce di limone e caffè",
          pranzo: "Insalatona ricca: tonno al naturale (80g), mais, olive, uovo sodo e cetrioli",
          spuntino: "Tisana + 2 quadretti di cioccolato fondente 85%",
          cena: "Calamari alla piastra con bietole al vapore e olio a crudo"
        },
        6: {
          colazione: "Mug cake d'avena e banana al microonde (2 min) + caffè americano",
          pranzo: "Risotto leggero agli spinaci mantecato con un cucchiaio di robiola",
          spuntino: "1 vasetto di kefir bianco",
          cena: "Cena sfiziosa: Piadina all'olio con bresaola, rucola e scaglie di parmigiano"
        },
        7: {
          colazione: "French toast leggero con pane integrale, albume e mirtilli caldi",
          pranzo: "Pranzo della domenica: Tagliata di filetto con insalata di carciofi crudi",
          spuntino: "Tisana rilassante al finocchio o mela-cannella",
          cena: "Crema tiepida di carote e zenzero con crostini e formaggio spalmabile light"
        }
      }
    };

    // Days configuration
    const GIORNI = [
      { id: 1, breve: 'Lun', nome: 'Lunedì' },
      { id: 2, breve: 'Mar', nome: 'Martedì' },
      { id: 3, breve: 'Mer', nome: 'Mercoledì' },
      { id: 4, breve: 'Gio', nome: 'Giovedì' },
      { id: 5, breve: 'Ven', nome: 'Venerdì' },
      { id: 6, breve: 'Sab', nome: 'Sabato' },
      { id: 7, breve: 'Dom', nome: 'Domenica' }
    ];

    // Compute day of week (Lun=1, Dom=7)
    function calcolaGiornoOggi() {
      const day = new Date().getDay();
      return day === 0 ? 7 : day;
    }

    // State management
    let state = {
      profilo: localStorage.getItem('menu_frigo_profilo') || 'lui',
      giornoOggi: calcolaGiornoOggi(),
      giornoSelezionato: calcolaGiornoOggi()
    };

    // Date formatter
    function formattaDataOggi() {
      const now = new Date();
      const stringa = now.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      return stringa.charAt(0).toUpperCase() + stringa.slice(1);
    }

    function renderBarraGiorni() {
      const container = document.getElementById('days-nav-container');
      container.innerHTML = '';

      GIORNI.forEach(g => {
        const isSelezionato = g.id === state.giornoSelezionato;
        const isOggi = g.id === state.giornoOggi;

        const btn = document.createElement('button');
        btn.className = `flex flex-col items-center justify-center flex-1 min-w-[40px] py-1.5 px-0.5 rounded-xl transition-all relative select-none ${
          isSelezionato
            ? 'bg-emerald-600 text-white font-bold shadow-sm scale-105'
            : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 font-medium'
        }`;

        const dotOggi = isOggi
          ? `<span class="w-1.5 h-1.5 rounded-full ${isSelezionato ? 'bg-white' : 'bg-emerald-500'} absolute top-1 right-1"></span>`
          : '';

        btn.innerHTML = `
          ${dotOggi}
          <span class="text-[11px] leading-tight uppercase font-semibold">${g.breve}</span>
          <span class="text-[9px] leading-none mt-0.5 opacity-80">${isOggi ? 'Oggi' : ''}</span>
        `;

        btn.addEventListener('click', () => {
          state.giornoSelezionato = g.id;
          renderBarraGiorni();
          renderPasti();
        });

        container.appendChild(btn);
      });

      // Update active label
      const activeObj = GIORNI.find(g => g.id === state.giornoSelezionato);
      document.getElementById('viewing-day-label').textContent = activeObj ? activeObj.nome : '';
      
      const isViewingToday = state.giornoSelezionato === state.giornoOggi;
      document.getElementById('badge-today-active').classList.toggle('hidden', !isViewingToday);
    }

    function renderPasti() {
      const container = document.getElementById('meals-list');
      container.innerHTML = '';

      const pianoGiorno = PIANO_ALIMENTARE[state.profilo]?.[state.giornoSelezionato] || {};

      const sezioni = [
        { chiave: 'colazione', titolo: 'Colazione', icona: 'ph-coffee', colore: 'text-amber-600 dark:text-amber-400 bg-amber-500/10' },
        { chiave: 'pranzo', titolo: 'Pranzo', icona: 'ph-cooking-pot', colore: 'text-orange-600 dark:text-orange-400 bg-orange-500/10' },
        { chiave: 'spuntino', titolo: 'Spuntino / Merenda', icona: 'ph-apple', colore: 'text-lime-600 dark:text-lime-400 bg-lime-500/10' },
        { chiave: 'cena', titolo: 'Cena', icona: 'ph-moon-stars', colore: 'text-indigo-600 dark:text-indigo-400 bg-indigo-500/10' }
      ];

      sezioni.forEach(sec => {
        const testo = pianoGiorno[sec.chiave] || 'Nessun pasto configurato';

        const card = document.createElement('div');
        card.className = "card-fade bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 rounded-2xl p-4 shadow-xs";

        card.innerHTML = `
          <div class="flex items-center gap-2.5 mb-2">
            <div class="w-7 h-7 rounded-lg ${sec.colore} flex items-center justify-center text-sm font-bold">
              <i class="ph-bold ${sec.icona}"></i>
            </div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">${sec.titolo}</h3>
          </div>
          <p class="text-slate-800 dark:text-slate-100 font-medium text-sm leading-relaxed pl-9">
            ${escapeHTML(testo)}
          </p>
        `;

        container.appendChild(card);
      });
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function aggiornaStatoProfilo() {
      const tabLui = document.getElementById('tab-lui');
      const tabLei = document.getElementById('tab-lei');

      if (state.profilo === 'lui') {
        tabLui.className = "flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-xs bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400";
        tabLei.className = "flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
        tabLui.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-emerald-500";
        tabLei.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-transparent";
      } else {
        tabLei.className = "flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-xs bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400";
        tabLui.className = "flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
        tabLei.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-emerald-500";
        tabLui.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-transparent";
      }

      localStorage.setItem('menu_frigo_profilo', state.profilo);
    }

    // Force fresh page load with random cachebuster param
    function eseguiRicaricaForzata() {
      const url = new URL(window.location.href);
      url.searchParams.set('_t', Date.now());
      url.searchParams.set('_reload', Math.random().toString(36).substring(7));
      window.location.href = url.toString();
    }

    // Theme switcher
    function initTheme() {
      const savedTheme = localStorage.getItem('menu_frigo_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('menu_frigo_theme', isDark ? 'dark' : 'light');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();

      document.getElementById('today-sub-caption').textContent = formattaDataOggi();

      // Profile tab events
      document.getElementById('tab-lui').addEventListener('click', () => {
        state.profilo = 'lui';
        aggiornaStatoProfilo();
        renderPasti();
      });

      document.getElementById('tab-lei').addEventListener('click', () => {
        state.profilo = 'lei';
        aggiornaStatoProfilo();
        renderPasti();
      });

      // Jump to today button
      document.getElementById('jump-to-today-btn').addEventListener('click', () => {
        state.giornoSelezionato = state.giornoOggi;
        renderBarraGiorni();
        renderPasti();
      });

      // Reload & Theme buttons
      document.getElementById('force-reload-btn').addEventListener('click', eseguiRicaricaForzata);
      document.getElementById('theme-btn').addEventListener('click', toggleTheme);

      // Initial page draw
      aggiornaStatoProfilo();
      renderBarraGiorni();
      renderPasti();
    });
  </script>
</body>
</html>
