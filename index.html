        extend: {
          fontFamily: {

            brand: {

      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Smooth transitions */
    .fade-in {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

        },

          spuntino: "Spicchi di mela con cannella",

        6: {
          colazione: "Smoothie bowl con frutti di bosco, fiocchi d'avena e semi di lino",

          merenda: "Una manciata di noci (25g)",

        },
        7: {
          colazione: "Waffle d'avena con frutti rossi e yogurt bianco",
          spuntino: "Frutta secca mista (20g)",
          pranzo: "Pranzo in famiglia: Pollo arrosto al forno senza pelle con patate novelle",
          merenda: "Tè verde con biscotto d'avena integrale",

      p2: {

          spuntino: "1 mela Fuji tagliata a fettine",

          cena: "Calamari alla griglia con bietole al vapore e goccio d'olio extravergine"
        },

        },

          pranzo: "Pranzo domenicale: Tagliata di manzo con insalata di carciofi crudi e grana",
          merenda: "Tisana rilassante finocchio o mela e cannella",
          cena: "Crema tiepida di carote e zenzero con tofu dorato o ricotta fresca"
        }
      }
    };

    let appData = {
      profiles: {
        p1: 'Marco',
        p2: 'Monica'
      },
      currentProfile: 'p1', // 'p1' or 'p2'
      selectedDay: 1,       // 1 (Lun) to 7 (Dom)
      todayDay: 1,          // Calculated at boot
      menus: null
    };

    // Safe LocalStorage helpers
    function loadState() {
      try {
        const savedMenus = localStorage.getItem('diet_frigo_menus');
        appData.menus = savedMenus ? JSON.parse(savedMenus) : JSON.parse(JSON.stringify(DEFAULT_MENUS));
        
        const savedProfiles = localStorage.getItem('diet_frigo_profiles');
        if (savedProfiles) {
          appData.profiles = JSON.parse(savedProfiles);
        }

        const savedCurrentProfile = localStorage.getItem('diet_frigo_active_profile');
        if (savedCurrentProfile && (savedCurrentProfile === 'p1' || savedCurrentProfile === 'p2')) {
          appData.currentProfile = savedCurrentProfile;
        }

        const savedTheme = localStorage.getItem('diet_frigo_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        console.error("Errore caricamento dati:", e);
        appData.menus = JSON.parse(JSON.stringify(DEFAULT_MENUS));
      }
    }

    function saveMenus() {
      try {
        localStorage.setItem('diet_frigo_menus', JSON.stringify(appData.menus));
      } catch(e) {
        console.error("Errore salvataggio menù:", e);
      }
    }

    function saveProfiles() {
      try {
        localStorage.setItem('diet_frigo_profiles', JSON.stringify(appData.profiles));
        localStorage.setItem('diet_frigo_active_profile', appData.currentProfile);
      } catch(e) {
        console.error("Errore salvataggio profili:", e);
      }
    }

    // Identify current real-world weekday
    function computeToday() {
      const jsDay = new Date().getDay(); // 0 = Dom, 1 = Lun, ... 6 = Sab
      // Map JS day to our format: Lun=1, Mar=2, ..., Dom=7
      return jsDay === 0 ? 7 : jsDay;
    }

    function getTodayFormattedDate() {
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const formatted = now.toLocaleDateString('it-IT', options);
      // Capitalize first letter
      return formatted.charAt(0).toUpperCase() + formatted.slice(1);
    }

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      const text = document.getElementById('toast-message');
      text.innerText = msg;
      box.classList.remove('opacity-0', 'pointer-events-none');
      box.classList.add('opacity-100');
      setTimeout(() => {
        box.classList.add('opacity-0', 'pointer-events-none');
        box.classList.remove('opacity-100');
      }, 2300);
    }

    function renderDayStrip() {
      const strip = document.getElementById('days-strip');
      strip.innerHTML = '';

      DAYS.forEach(day => {
        const isSelected = day.id === appData.selectedDay;
        const isToday = day.id === appData.todayDay;

        const btn = document.createElement('button');
        btn.setAttribute('data-day', day.id);
        btn.className = `flex flex-col items-center justify-center flex-1 min-w-[42px] py-1.5 px-1 rounded-xl transition-all select-none relative ${
          isSelected
            ? 'bg-emerald-600 text-white shadow-sm font-bold scale-[1.03]'
            : 'bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 font-medium'
        }`;

        // Today pill dot
        const todayDot = isToday
          ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-emerald-500'} absolute top-1 right-1"></span>`
          : '';

        btn.innerHTML = `
          ${todayDot}
          <span class="text-[11px] leading-none uppercase tracking-tighter">${day.short}</span>
          <span class="text-[10px] opacity-75 mt-0.5 leading-none">${day.id === appData.todayDay ? 'Oggi' : ''}</span>
        `;

        btn.addEventListener('click', () => {
          appData.selectedDay = day.id;
          renderDayStrip();
          renderMeals();
        });

        strip.appendChild(btn);
      });

      // Update active day title & today badge
      const activeObj = DAYS.find(d => d.id === appData.selectedDay);
      document.getElementById('active-day-title').textContent = activeObj ? activeObj.name : '';
      const isViewingToday = appData.selectedDay === appData.todayDay;
      const todayBadge = document.getElementById('badge-is-today');
      if (isViewingToday) {
        todayBadge.classList.remove('hidden');
      } else {
        todayBadge.classList.add('hidden');
      }
    }

    function renderMeals() {
      const container = document.getElementById('meals-container');
      container.innerHTML = '';

      const dayMeals = appData.menus[appData.currentProfile]?.[appData.selectedDay] || {
        colazione: "Nessun dato inserito",
        spuntino: "Nessun dato inserito",
        pranzo: "Nessun dato inserito",
        merenda: "Nessun dato inserito",
        cena: "Nessun dato inserito"
      };

      const mealDefs = [
        { key: 'colazione', label: 'Colazione', icon: 'ph-coffee', color: 'amber', bg: 'bg-amber-500/10 text-amber-600 dark:text-amber-400' },
        { key: 'spuntino', label: 'Spuntino Mattina', icon: 'ph-apple', color: 'lime', bg: 'bg-lime-500/10 text-lime-600 dark:text-lime-400' },
        { key: 'pranzo', label: 'Pranzo', icon: 'ph-cooking-pot', color: 'orange', bg: 'bg-orange-500/10 text-orange-600 dark:text-orange-400' },
        { key: 'merenda', label: 'Merenda Pomeriggio', icon: 'ph-cookie', color: 'pink', bg: 'bg-pink-500/10 text-pink-600 dark:text-pink-400' },
        { key: 'cena', label: 'Cena', icon: 'ph-moon-stars', color: 'indigo', bg: 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400' }
      ];

      mealDefs.forEach(m => {
        const text = dayMeals[m.key] || 'Non specificato';
        
        const card = document.createElement('div');
        card.className = "fade-in bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800/90 rounded-2xl p-4 shadow-xs flex flex-col justify-between transition-all hover:border-emerald-500/30";

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-1.5">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-lg ${m.bg} flex items-center justify-center text-base">
                <i class="ph-bold ${m.icon}"></i>
              </div>
              <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">${m.label}</span>
            </div>
            <button class="edit-single-meal-btn text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 p-1" title="Modifica pasto">
              <i class="ph-bold ph-pencil-simple text-sm"></i>
            </button>
          </div>
          <p class="text-slate-800 dark:text-slate-100 font-medium text-sm leading-relaxed whitespace-pre-line pl-9">
            ${escapeHtml(text)}
          </p>
        `;

        // Click card or edit button to open modal
        card.querySelector('.edit-single-meal-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal();
        });

        container.appendChild(card);
      });

      // Add a handy edit full day button at the bottom
      const bottomAction = document.createElement('div');
      bottomAction.className = "pt-2 flex justify-center";
      bottomAction.innerHTML = `
        <button id="edit-whole-day-btn" class="w-full py-3 px-4 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 hover:border-emerald-500 text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 text-xs font-semibold flex items-center justify-center gap-2 transition">
          <i class="ph-bold ph-note-pencil text-base"></i>
          Modifica menù di ${DAYS.find(d => d.id === appData.selectedDay).name} (${appData.profiles[appData.currentProfile]})
        </button>
      `;
      bottomAction.querySelector('#edit-whole-day-btn').addEventListener('click', openEditModal);
      container.appendChild(bottomAction);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function updateProfileUI() {
      const p1Btn = document.getElementById('profile-btn-p1');
      const p2Btn = document.getElementById('profile-btn-p2');
      const p1Label = document.getElementById('profile-label-p1');
      const p2Label = document.getElementById('profile-label-p2');

      p1Label.textContent = appData.profiles.p1;
      p2Label.textContent = appData.profiles.p2;

      if (appData.currentProfile === 'p1') {
        p1Btn.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-sm bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400";
        p2Btn.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
        p1Btn.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
        p2Btn.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-transparent inline-block";
      } else {
        p2Btn.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-sm bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400";
        p1Btn.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
        p2Btn.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
        p1Btn.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-transparent inline-block";
      }
    }

    function openEditModal() {
      const modal = document.getElementById('edit-modal');
      const activeDay = DAYS.find(d => d.id === appData.selectedDay);
      const profileName = appData.profiles[appData.currentProfile];
      
      document.getElementById('modal-subtitle').textContent = `${profileName} • ${activeDay.name}`;

      const current = appData.menus[appData.currentProfile]?.[appData.selectedDay] || {};
      document.getElementById('edit-colazione').value = current.colazione || '';
      document.getElementById('edit-spuntino').value = current.spuntino || '';
      document.getElementById('edit-pranzo').value = current.pranzo || '';
      document.getElementById('edit-merenda').value = current.merenda || '';
      document.getElementById('edit-cena').value = current.cena || '';

      modal.classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function saveEditedMeals(e) {
      e.preventDefault();
      const prof = appData.currentProfile;
      const day = appData.selectedDay;

      if (!appData.menus[prof]) appData.menus[prof] = {};

      appData.menus[prof][day] = {
        colazione: document.getElementById('edit-colazione').value.trim(),
        spuntino: document.getElementById('edit-spuntino').value.trim(),
        pranzo: document.getElementById('edit-pranzo').value.trim(),
        merenda: document.getElementById('edit-merenda').value.trim(),
        cena: document.getElementById('edit-cena').value.trim()
      };

      saveMenus();
      closeEditModal();
      renderMeals();
      showToast("Menù aggiornato con successo!");
    }

    function openSettingsModal() {
      document.getElementById('input-name-p1').value = appData.profiles.p1;
      document.getElementById('input-name-p2').value = appData.profiles.p2;
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function saveCustomNames() {
      const n1 = document.getElementById('input-name-p1').value.trim() || 'Lui';
      const n2 = document.getElementById('input-name-p2').value.trim() || 'Lei';
      appData.profiles.p1 = n1;
      appData.profiles.p2 = n2;
      saveProfiles();
      updateProfileUI();
      closeSettingsModal();
      renderMeals();
      showToast("Nomi profili salvati!");
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('diet_frigo_theme', isDark ? 'dark' : 'light');
    }

    function exportBackup() {
      const exportObject = {
        profiles: appData.profiles,
        menus: appData.menus,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(exportObject, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `menu-frigo-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Backup esportato!");
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.menus && parsed.profiles) {
            appData.menus = parsed.menus;
            appData.profiles = parsed.profiles;
            saveMenus();
            saveProfiles();
            updateProfileUI();
            renderMeals();
            closeSettingsModal();
            showToast("Dati importati con successo!");
          } else {
            showToast("Formato file non valido!");
          }
        } catch (err) {
          showToast("Errore durante l'importazione!");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function resetToDefault() {
      appData.menus = JSON.parse(JSON.stringify(DEFAULT_MENUS));
      appData.profiles = { p1: 'Lui', p2: 'Lei' };
      saveMenus();
      saveProfiles();
      updateProfileUI();
      renderMeals();
      closeSettingsModal();
      showToast("Ripristinato menù di default!");
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadState();

      // Compute actual current day
      appData.todayDay = computeToday();
      appData.selectedDay = appData.todayDay;

      // Update date header caption
      document.getElementById('current-date-caption').textContent = getTodayFormattedDate();

      // Profile Switchers
      document.getElementById('profile-btn-p1').addEventListener('click', () => {
        appData.currentProfile = 'p1';
        saveProfiles();
        updateProfileUI();
        renderMeals();
      });

      document.getElementById('profile-btn-p2').addEventListener('click', () => {
        appData.currentProfile = 'p2';
        saveProfiles();
        updateProfileUI();
        renderMeals();
      });

      // Jump to today button
      document.getElementById('jump-today-btn').addEventListener('click', () => {
        appData.selectedDay = appData.todayDay;
        renderDayStrip();
        renderMeals();
      });

      // Theme toggle
      document.getElementById('theme-toggle-btn').addEventListener('click', toggleDarkMode);

      // Settings modal toggles
      document.getElementById('open-settings-btn').addEventListener('click', openSettingsModal);
      document.getElementById('close-settings-btn').addEventListener('click', closeSettingsModal);
      document.getElementById('save-names-btn').addEventListener('click', saveCustomNames);
      document.getElementById('export-json-btn').addEventListener('click', exportBackup);
      document.getElementById('import-json-file').addEventListener('change', importBackup);
      document.getElementById('reset-default-btn').addEventListener('click', resetToDefault);

      // Meal Edit modal
      document.getElementById('close-modal-btn').addEventListener('click', closeEditModal);
      document.getElementById('cancel-modal-btn').addEventListener('click', closeEditModal);
      document.getElementById('edit-meal-form').addEventListener('submit', saveEditedMeals);

      // Initial Render
      updateProfileUI();
      renderDayStrip();
      renderMeals();
    });
  </script>
</body>
</html>
